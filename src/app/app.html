<router-outlet />

@if (errorService.errorMessage()) {
<div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm transition-all duration-300">
    <div class="bg-[#0B1224] border border-red-500/30 rounded-2xl p-6 max-w-md w-full shadow-2xl animate-in fade-in zoom-in-95 duration-200">
        <div class="flex items-center gap-3 text-red-500 mb-4">
            <mat-icon class="!text-3xl h-[30px] w-[30px] !text-[30px]">error_outline</mat-icon>
            <h3 class="text-xl font-bold tracking-tight">Error Occurred</h3>
        </div>
        <p class="text-slate-300 text-sm leading-relaxed mb-6">
            {{ errorService.errorMessage() }}
        </p>
        <div class="flex items-center justify-end gap-3">
            <button (click)="errorService.clearError()"
                class="px-5 py-2.5 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors duration-200 cursor-pointer">
                Dismiss
            </button>
        </div>
    </div>
</div>
}
