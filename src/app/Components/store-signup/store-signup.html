<div class="flex justify-center items-center h-screen w-full">
    <div class="flex flex-col w-[33%] h-[70%] bg-[#0F172A] rounded-lg items-center relative overflow-hidden">

        @if (!isSuccess()) {
            <!-- Form Container -->
            <div class="signup-form-panel w-full h-full flex flex-col items-center absolute top-0">
                <h1 class="text-center text-white text-2xl font-bold mt-4">Stamp Network</h1>
                <p class="text-center text-sm text-gray-400">Register your store</p>
                <form (submit)="onSubmit($event)" class="flex flex-col w-[80%] h-full mt-10">
                    <div class="flex flex-col gap-2">
                        <label class="font-semibold text-white">Store Name</label>
                        <input type="text" [formField]="storeForm.storeName"
                            class="border-[#3D3737] border-1 p-1.5 pl-3 rounded-md text-white" placeholder="Store Name">
                    </div>
                    <div class="flex flex-col gap-2 mt-5">
                        <label class="font-semibold text-white">Email</label>
                        <input type="email" [formField]="storeForm.email"
                            class="border-[#3D3737] border-1 p-1.5 pl-3 rounded-md text-white"
                            placeholder="Youremail@email.com">
                    </div>
                    <div class="flex flex-col gap-2 mt-5 relative">
                        <label class="font-semibold text-white">Password</label>
                        <input [type]="helperService.showPassword() ? 'text' : 'password'" [formField]="storeForm.password"
                            class="border-[#3D3737] border-1 p-1.5 pl-3 rounded-md text-white" placeholder="Password">
                        <mat-icon class="absolute right-2 top-10 cursor-pointer text-white"
                            (click)="helperService.togglePasswordVisibility()">{{ helperService.showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </div>
                    <button [disabled]="isLoading()" class="bg-[#00D492] text-black text-lg rounded-md p-1.5 font-bold mt-20 cursor-pointer hover:bg-[#00b57c] transition-colors disabled:opacity-50 flex justify-center items-center gap-2">
                        @if (isLoading()) {
                            <mat-icon class="animate-spin">autorenew</mat-icon> Creating...
                        } @else {
                            Create Account
                        }
                    </button>
                    <p class="text-center mt-2 text-white">
                        Already have an account?
                        <a routerLink="/login" class="text-[#00D492] cursor-pointer hover:underline">Sign in here</a>
                    </p>
                </form>
            </div>
        } @else {
            <!-- Success Message Container -->
            <div class="signup-success-panel w-full h-full flex flex-col items-center justify-center absolute top-0">
                <div class="signup-success-icon w-20 h-20 bg-[#00D492] rounded-full flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(0,212,146,0.5)]">
                    <mat-icon class="text-black">check</mat-icon>
                </div>
                <h2 class="signup-success-title text-white text-2xl font-bold mb-3">
                    Store Registered!
                </h2>
                <p class="signup-success-text text-gray-400 text-center mb-8 px-8">
                    Your store has been created successfully. You can now login to manage your digital stamps.
                </p>
                <button routerLink="/login" class="signup-success-btn bg-[#00D492] text-black text-lg rounded-md px-8 py-2 font-bold cursor-pointer hover:bg-[#00b57c]">
                    Go to Login
                </button>
            </div>
        }

    </div>
</div>
